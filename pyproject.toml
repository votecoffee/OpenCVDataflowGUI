[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencv-dataflow-gui"
version = "0.1.0"
description = "Visual OpenCV development and execution with extensible Python blocks"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT AND OFL-1.1"
dependencies = ["numpy>=2,<3", "opencv-contrib-python>=5.0.0.93,<6", "PySide6>=6.8,<7", "Pillow>=12,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
annoy = ["annoy>=1.17.3,<2"]
barcodes = ["zxing-cpp>=3.1.1,<4"]
logix = ["pycomm3==1.2.16"]
mqtt = ["paho-mqtt>=2.1,<3"]
morphology = ["scikit-image>=0.25.2,<0.27"]
skimage = ["scikit-image>=0.26,<0.27"]
lightglue = ["torch>=2.5,<3", "torchvision>=0.20,<1", "kornia>=0.7,<1", "matplotlib>=3.8,<4"]
ml-test = ["onnx>=1.17,<2", "annoy>=1.17.3,<2"]

[project.scripts]
opencv-dataflow = "opencv_dataflow.app:main"
opencv-dataflow-run = "opencv_dataflow.runner:main"
opencv-dataflow-api = "opencv_dataflow.assistant_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opencv_dataflow = ["fonts/*.ttf", "fonts/*.txt", "fonts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
